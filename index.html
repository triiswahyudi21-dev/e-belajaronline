                      <textarea 
                        name="questionText" 
                        defaultValue={editingQuestion ? editingQuestion.questionText : ''} 
                        required 
                        rows="3" 
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:border-blue-500 outline-none" 
                        placeholder="Tuliskan soal... Gunakan $rumus$ untuk rumus matematika."
                      ></textarea>
                    </div>

                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">URL Gambar Soal (Opsional)</label>
                      <input 
                        type="url" 
                        name="questionImage" 
                        defaultValue={editingQuestion ? editingQuestion.questionImage : ''} 
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2 text-xs text-white" 
                        placeholder="https://..." 
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[11px] text-slate-400 mb-1">Tipe Soal</label>
                        <select 
                          name="type" 
                          value={formQuestionType}
                          onChange={(e) => setFormQuestionType(e.target.value)}
                          className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2 text-xs text-white focus:border-blue-500 outline-none"
                        >
                          <option value="pg">Pilihan Ganda</option>
                          <option value="isian">Isian Singkat</option>
                        </select>
                      </div>

                      {formQuestionType === 'pg' ? (
                        <div>
                          <label className="block text-[11px] text-slate-400 mb-1">Kunci Jawaban PG</label>
                          <select 
                            name="correctAnswer" 
                            defaultValue={editingQuestion ? editingQuestion.correctAnswer : 'A'} 
                            className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2 text-xs text-white focus:border-blue-500 outline-none"
                          >
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                          </select>
                        </div>
                      ) : (
                        <div>
                          <label className="block text-[11px] text-slate-400 mb-1">Kunci Jawaban Isian</label>
                          <input 
                            type="text" 
                            name="correctAnswerIsian" 
                            defaultValue={editingQuestion ? editingQuestion.correctAnswer : ''} 
                            required
                            placeholder="Tulis Kunci Jawaban..." 
                            className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2 text-xs text-white focus:border-blue-500 outline-none" 
                          />
                        </div>
                      )}
                    </div>

                    {formQuestionType === 'pg' && (
                      <div className="grid grid-cols-2 gap-2">
                        <input 
                          type="text" 
                          name="optionA" 
                          defaultValue={editingQuestion ? editingQuestion.optionA : ''} 
                          placeholder="Opsi A" 
                          className="bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-white" 
                        />
                        <input 
                          type="text" 
                          name="optionB" 
                          defaultValue={editingQuestion ? editingQuestion.optionB : ''} 
                          placeholder="Opsi B" 
                          className="bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-white" 
                        />
                        <input 
                          type="text" 
                          name="optionC" 
                          defaultValue={editingQuestion ? editingQuestion.optionC : ''} 
                          placeholder="Opsi C" 
                          className="bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-white" 
                        />
                        <input 
                          type="text" 
                          name="optionD" 
                          defaultValue={editingQuestion ? editingQuestion.optionD : ''} 
                          placeholder="Opsi D" 
                          className="bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-white" 
                        />
                      </div>
                    )}

                    <button 
                      type="submit" 
                      className={`w-full font-bold py-2 rounded-xl text-xs transition-all text-white ${editingQuestion ? 'bg-amber-600 hover:bg-amber-500' : 'bg-emerald-600 hover:bg-emerald-500'}`}
                    >
                      {editingQuestion ? 'Simpan Perubahan Soal' : '+ Simpan Soal'}
                    </button>
                  </form>

                  {/* MODUL 2: BATCH COPY-PASTE SOAL MASSAL */}
                  <form onSubmit={handleBatchPasteQuestions} className="space-y-3 bg-slate-950 p-4 rounded-xl border border-slate-800 flex flex-col justify-between">
                    <div>
                      <h3 className="font-bold text-white text-xs flex items-center gap-1.5"><FileSpreadsheet className="w-4 h-4 text-blue-400"/> Upload Soal Massal (Copy-Paste)</h3>
                      <p className="text-[10px] text-slate-400 mt-1 mb-2">Pisahkan antar soal dengan 1 baris kosong. Kunci jawaban ditulis di baris akhir soal (`Kunci: A`).</p>
                      
                      <textarea 
                        rows="8" 
                        value={batchQuestionsText}
                        onChange={(e) => setBatchQuestionsText(e.target.value)}
                        placeholder={`Contoh Format:\n\n1. Berapakah 2 + 2?\nA. 3\nB. 4\nC. 5\nD. 6\nKunci: B\n\n2. Ibu kota Indonesia adalah...\nA. Jakarta\nB. Surabaya\nC. Bandung\nD. Medan\nKunci: A`}
                        className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white font-mono outline-none focus:border-blue-500"
                      ></textarea>
                    </div>

                    <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-xs transition-all">
                      Upload Soal Massal
                    </button>
                  </form>
                </div>
              </div>

              {/* LIST SOAL TERDISPLAI */}
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-xl">
                <h3 className="font-bold text-white text-sm mb-4">Daftar Soal Tersimpan ({matQuestions.length})</h3>
                <div className="space-y-3">
                  {matQuestions.map((q, idx) => (
                    <div key={q.id} className={`p-4 rounded-xl bg-slate-950 border transition-all relative ${editingQuestion && editingQuestion.id === q.id ? 'border-amber-500/80 ring-1 ring-amber-500' : 'border-slate-800'}`}>
                      <div className="absolute top-4 right-4 flex items-center gap-1.5">
                        <button 
                          onClick={() => setEditingQuestion(q)} 
                          title="Edit Soal Ini"
                          className="text-slate-500 hover:text-amber-400 transition-colors p-1"
                        >
                          <Edit className="w-4 h-4" />
                        </button>
                        <button 
                          onClick={() => handleDeleteQuestion(q.id)} 
                          title="Hapus Soal Ini"
                          className="text-slate-500 hover:text-red-400 transition-colors p-1"
                        >
                          <Trash2 className="w-4 h-4" />
                        </button>
                      </div>

                      <div className="font-semibold text-slate-200 text-xs mb-3 pr-16 flex items-start gap-2">
                        <span className="text-blue-400 font-bold">{idx + 1}.</span>
                        <div className="flex-1"><RenderMathText text={q.questionText} /></div>
                      </div>

                      {q.questionImage && (
                        <img 
                          src={getSafeImageUrl(q.questionImage)} 
                          alt="Gambar Soal" 
                          referrerPolicy="no-referrer"
                          onError={(e) => {
                            if (!e.target.dataset.tried) {
                              e.target.dataset.tried = 'true';
                              e.target.src = `https://images.weserv.nl/?url=${encodeURIComponent(q.questionImage)}`;
                            }
                          }}
                          className="max-h-40 rounded-lg border border-slate-800 my-2" 
                        />
                      )}

                      {q.type === 'pg' ? (
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs text-slate-300 mt-2">
                          {['A', 'B', 'C', 'D'].map((optKey) => {
                            const optText = q[`option${optKey}`];
                            if (!optText) return null;
                            const isCorrect = q.correctAnswer === optKey;
                            return (
                              <div key={optKey} className={`flex items-center gap-2 p-2 rounded-lg border ${isCorrect ? 'bg-emerald-500/10 border-emerald-500/40 text-emerald-400 font-bold' : 'bg-slate-900 border-slate-800'}`}>
                                <div className={`w-3.5 h-3.5 rounded-full border flex items-center justify-center ${isCorrect ? 'border-emerald-400 bg-emerald-500' : 'border-slate-600'}`}>
                                  {isCorrect && <div className="w-1.5 h-1.5 bg-slate-950 rounded-full"></div>}
                                </div>
                                <div className="flex-1"><RenderMathText text={optText} /></div>
                              </div>
                            );
                          })}
                        </div>
                      ) : (
                        <div className="mt-2 p-2 rounded-lg bg-emerald-500/10 border border-emerald-500/30 text-xs text-emerald-400 font-semibold">
                          Kunci Jawaban Isian: <span className="text-white font-bold">{q.correctAnswer}</span>
                        </div>
                      )}
                    </div>
                  ))}
                  {matQuestions.length === 0 && <p className="text-slate-500 text-xs italic">Belum ada soal latihan untuk materi ini.</p>}
                </div>
              </div>
            </div>
          );
        }

        if (activeTab === 'upload_siswa') {
          const currentFilteredStudents = students.filter(s => s.kelas === manageStudentClass && s.subKelas === manageStudentSubClass);
          
          return (
            <div className="space-y-6 max-w-5xl mx-auto">
              <div className="flex justify-between items-center">
                <h2 className="text-lg font-bold text-white flex items-center gap-2"><UserPlus className="text-blue-500"/> Kelola Database Siswa</h2>
                <button onClick={() => setActiveTab('dashboard')} className="text-slate-400 hover:text-white flex items-center gap-1 text-xs font-semibold">
                  <ArrowLeft className="w-4 h-4"/> Kembali
                </button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-xl">
                  <h3 className="font-bold text-white text-xs mb-4">Batch Upload Nama Siswa</h3>
                  <form onSubmit={handleUploadStudents} className="space-y-4">
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-400 mb-1">Kelas</label>
                        <select value={studentInputKelas} onChange={(e) => setStudentInputKelas(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
                          <option value="7">Kelas 7</option>
                          <option value="8">Kelas 8</option>
                          <option value="9">Kelas 9</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-400 mb-1">Rombel</label>
                        <select value={studentInputSubKelas} onChange={(e) => setStudentInputSubKelas(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
                          <option value="A">Rombel A</option>
                          <option value="B">Rombel B</option>
                          <option value="C">Rombel C</option>
                          <option value="D">Rombel D</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Daftar Nama Siswa (Copy-Paste 1 Nama Per Baris)</label>
                      <textarea 
                        rows="8" 
                        value={rawStudentNames}
                        onChange={(e) => setRawStudentNames(e.target.value)}
                        placeholder="Contoh:&#10;Ahmad Rizky Pratama&#10;Anisa Rahmawati"
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-blue-500 leading-relaxed"
                      ></textarea>
                    </div>

                    <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-xs transition-all">
                      Simpan Ke Database
                    </button>
                  </form>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-xl flex flex-col">
                  <div className="flex justify-between items-center mb-4">
                    <h3 className="font-bold text-white text-xs">Daftar Siswa Terdaftar</h3>
                    <div className="flex gap-2">
                      <select value={manageStudentClass} onChange={(e) => setManageStudentClass(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-lg p-1.5 text-xs text-white">
                        <option value="7">Kelas 7</option>
                        <option value="8">Kelas 8</option>
                        <option value="9">Kelas 9</option>
                      </select>
                      <select value={manageStudentSubClass} onChange={(e) => setManageStudentSubClass(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-lg p-1.5 text-xs text-white">
                        <option value="A">Rombel A</option>
                        <option value="B">Rombel B</option>
                        <option value="C">Rombel C</option>
                        <option value="D">Rombel D</option>
                      </select>
                    </div>
                  </div>

                  <div className="flex-1 overflow-y-auto max-h-[350px] space-y-2 pr-1">
                    {currentFilteredStudents.map((st, i) => (
                      <div key={st.id} className="flex justify-between items-center p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-300">
                        <span>{i + 1}. {st.name}</span>
                        <button onClick={() => handleDeleteStudent(st.id)} className="text-slate-500 hover:text-red-400 p-1">
                          <Trash2 className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          );
        }

        if (activeTab === 'rekap_nilai') {
          const filteredScores = scores.filter(s => {
            const matchMapel = s.mapel === appSession.mapel;
            const matchClass = rekapFilterClass === 'semua' || s.kelas === rekapFilterClass;
            const matchSubClass = rekapFilterSubClass === 'semua' || s.subKelas === rekapFilterSubClass;
            return matchMapel && matchClass && matchSubClass;
          });

          return (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden max-w-5xl mx-auto shadow-xl">
              <div className="p-4 sm:p-6 border-b border-slate-800 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <h2 className="text-lg font-bold text-white flex items-center gap-2"><Award className="text-yellow-500"/> Rekap Nilai Evaluasi - {appSession.mapel}</h2>
                  <p className="text-xs text-slate-400 mt-1">Unduh rekap nilai khusus mapel {appSession.mapel} ke format Excel (.xlsx)</p>
                </div>
                
                <div className="flex flex-wrap items-center gap-2">
                  <button 
                    onClick={() => setActiveTab('dashboard')} 
                    className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-4 py-2.5 rounded-xl font-bold text-xs shadow-lg transition-all flex items-center justify-center gap-2"
                  >
                    <Home className="w-4 h-4 text-blue-400"/> Kembali ke Beranda
                  </button>
                  <button 
                    onClick={handleDeleteClassScores} 
                    disabled={rekapFilterClass === 'semua'} 
                    className="bg-red-600/20 hover:bg-red-600/30 disabled:opacity-50 text-red-400 border border-red-500/30 px-4 py-2.5 rounded-xl font-bold text-xs shadow-lg transition-all flex items-center justify-center gap-2"
                  >
                    <Trash2 className="w-4 h-4"/> Hapus Nilai Kelas {rekapFilterClass !== 'semua' ? rekapFilterClass : ''}
                  </button>
                  <button 
                    onClick={() => exportToExcel(filteredScores)} 
                    className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2.5 rounded-xl font-bold text-xs shadow-lg transition-all flex items-center justify-center gap-2"
                  >
                    <Download className="w-4 h-4"/> Export Excel (.xlsx)
                  </button>
                </div>
              </div>

              <div className="p-4 bg-slate-950/70 border-b border-slate-800 flex flex-wrap items-center gap-3 text-xs">
                <span className="text-slate-400 font-semibold">Filter:</span>
                <select value={rekapFilterClass} onChange={(e) => setRekapFilterClass(e.target.value)} className="bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1.5 text-white">
                  <option value="semua">Semua Kelas</option>
                  <option value="7">Kelas 7</option>
                  <option value="8">Kelas 8</option>
                  <option value="9">Kelas 9</option>
                </select>

                <select value={rekapFilterSubClass} onChange={(e) => setRekapFilterSubClass(e.target.value)} className="bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1.5 text-white">
                  <option value="semua">Semua Rombel</option>
                  <option value="A">Rombel A</option>
                  <option value="B">Rombel B</option>
                  <option value="C">Rombel C</option>
                  <option value="D">Rombel D</option>
                </select>
              </div>

              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead>
                    <tr className="bg-slate-950 text-slate-400 border-b border-slate-800">
                      <th className="p-4">No</th>
                      <th className="p-4">Nama Siswa</th>
                      <th className="p-4">Kelas</th>
                      <th className="p-4">Materi</th>
                      <th className="p-4 text-center">Nilai</th>
                      <th className="p-4 text-center">Aksi</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800 text-slate-300">
                    {filteredScores.map((s, idx) => (
                      <tr key={s.id || idx}>
                        <td className="p-4 text-slate-500 font-mono">{idx + 1}</td>
                        <td className="p-4 font-bold text-white">{s.studentName}</td>
                        <td className="p-4">Kelas {s.kelas}-{s.subKelas}</td>
                        <td className="p-4">{s.materialTitle}</td>
                        <td className="p-4 text-center font-bold font-mono text-emerald-400 text-sm">{s.score}</td>
                        <td className="p-4 text-center">
                          <button onClick={() => handleDeleteScore(s.id)} className="text-slate-500 hover:text-red-400 p-1.5">
                            <Trash2 className="w-4 h-4"/>
                          </button>
                        </td>
                      </tr>
                    ))}
                    {filteredScores.length === 0 && (
                      <tr>
                        <td colSpan="6" className="p-8 text-center text-slate-500 italic">
                          Belum ada rekap nilai masuk untuk filter ini.
                        </td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          );
        }

        // DEFAULT: DASHBOARD UTAMA GURU DENGAN SIDEBAR KIRI
        return (
          <div className="flex flex-col md:flex-row gap-6 max-w-7xl mx-auto">
            {/* SIDEBAR SEBELAH KIRI */}
            <aside className="w-full md:w-64 bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex flex-col justify-between shrink-0 self-start md:sticky md:top-4">
              <div className="space-y-6">
                {/* PROFIL RINGKAS GURU */}
                <div className="border-b border-slate-800 pb-4">
                  <span className="text-[10px] bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2.5 py-1 rounded-lg font-bold">
                    {appSession.mapel}
                  </span>
                  <h1 className="text-base font-extrabold text-white mt-2 leading-snug">{appSession.fullName}</h1>
                  <p className="text-slate-400 text-[11px] mt-0.5 font-mono">NIP: {appSession.nip}</p>
                </div>

                {/* NAVIGASI SIDEBAR */}
                <nav className="space-y-2">
                  <span className="text-[10px] font-bold text-slate-500 uppercase tracking-wider block px-1">Menu Utama</span>
                  
                  <button 
                    onClick={() => setActiveTab('tambah_materi')} 
                    className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold px-3 py-2.5 rounded-xl text-xs transition-all shadow-lg flex items-center gap-2.5"
                  >
                    <PlusCircle className="w-4 h-4"/> Terbitkan Materi Baru
                  </button>

                  <button 
                    onClick={() => setActiveTab('upload_siswa')} 
                    className="w-full bg-slate-950 hover:bg-slate-800 text-slate-200 border border-slate-800 font-bold px-3 py-2.5 rounded-xl text-xs transition-all flex items-center gap-2.5"
                  >
                    <UserPlus className="w-4 h-4 text-blue-400"/> Database Siswa
                  </button>

                  <button 
                    onClick={() => setActiveTab('rekap_nilai')} 
                    className="w-full bg-slate-950 hover:bg-slate-800 text-slate-200 border border-slate-800 font-bold px-3 py-2.5 rounded-xl text-xs transition-all flex items-center gap-2.5"
                  >
                    <Award className="w-4 h-4 text-amber-400"/> Rekap Nilai Evaluasi
                  </button>

                  <button 
                    onClick={() => setActiveTab('monitor')} 
                    className="w-full bg-slate-950 hover:bg-slate-800 text-slate-200 border border-slate-800 font-bold px-3 py-2.5 rounded-xl text-xs transition-all flex items-center gap-2.5"
                  >
                    <Radio className="w-4 h-4 text-emerald-400 animate-pulse"/> Pantau Membaca
                  </button>
                </nav>
              </div>

              <div className="pt-6 mt-6 border-t border-slate-800">
                <button 
                  onClick={handleLogout} 
                  className="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 font-bold px-3 py-2.5 rounded-xl text-xs transition-all flex items-center justify-center gap-2"
                >
                  <LogOut className="w-4 h-4"/> Keluar Sesi Guru
                </button>
              </div>
            </aside>

            {/* KONTEN KANAN: DAFTAR MATERI SAYA */}
            <main className="flex-1 space-y-4">
              <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                  <h2 className="text-base font-extrabold text-white">Daftar Materi Pembelajaran ({appSession.mapel})</h2>
                  <p className="text-slate-400 text-xs mt-0.5">Kelola materi dan soal latihan khusus mapel {appSession.mapel}</p>
                </div>
                <div className="text-xs bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl text-slate-400 font-semibold">
                  Total Materi: <strong className="text-blue-400">{myTeacherMaterials.length}</strong>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {myTeacherMaterials.map(m => {
                  const qCount = questions.filter(q => q.materialId === m.id).length;
                  return (
                    <div key={m.id} className="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col justify-between hover:border-slate-700 transition-all shadow-xl">
                      <div>
                        {m.imageUrl && (
                          <div className="h-32 bg-slate-950 overflow-hidden rounded-xl mb-3 flex items-center justify-center">
                            <img 
                              src={getSafeImageUrl(m.imageUrl)} 
                              alt={m.title} 
                              referrerPolicy="no-referrer"
                              onError={(e) => {
                                if (!e.target.dataset.tried) {
                                  e.target.dataset.tried = 'true';
                                  e.target.src = `https://images.weserv.nl/?url=${encodeURIComponent(m.imageUrl)}`;
                                }
                              }}
                              className="max-h-full max-w-full object-contain" 
                            />
                          </div>
                        )}
                        
                        <div className="flex justify-between items-center mb-2">
                          <span className="text-[10px] bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2 py-0.5 rounded-lg font-bold">
                            Kelas {m.kelas} • Sem {m.semester}
                          </span>
                          <span className="text-[10px] text-slate-400 font-mono">
                            {m.durationMinutes || 15} Menit
                          </span>
                        </div>

                        <h3 className="font-bold text-white text-sm leading-snug">{m.title}</h3>
                        <div className="text-slate-400 text-xs line-clamp-2 mt-1">
                          <RenderMathText text={m.content} />
                        </div>
                      </div>

                      <div className="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between gap-2">
                        <button 
                          onClick={() => { setSelectedMaterial(m); setActiveTab('kelola_soal'); }}
                          className="bg-blue-600/20 hover:bg-blue-600/30 text-blue-400 border border-blue-500/30 text-xs px-3 py-1.5 rounded-xl font-bold flex items-center gap-1.5 transition-all"
                        >
                          <List className="w-3.5 h-3.5"/> Soal ({qCount})
                        </button>

                        <div className="flex items-center gap-1">
                          <button 
                            onClick={() => { setEditingMaterial(m); setActiveTab('edit_materi'); }}
                            className="p-1.5 text-slate-400 hover:text-amber-400 transition-colors"
                            title="Edit Materi"
                          >
                            <Edit className="w-4 h-4"/>
                          </button>
                          <button 
                            onClick={() => handleDeleteMaterial(m.id)}
                            className="p-1.5 text-slate-400 hover:text-red-400 transition-colors"
                            title="Hapus Materi"
                          >
                            <Trash2 className="w-4 h-4"/>
                          </button>
                        </div>
                      </div>
                    </div>
                  );
                })}

                {myTeacherMaterials.length === 0 && (
                  <div className="col-span-full bg-slate-900 border border-slate-800 rounded-2xl p-12 text-center text-slate-500 text-xs">
                    Belum ada materi terbit untuk mata pelajaran {appSession.mapel}. Klik tombol "Terbitkan Materi Baru" untuk membuat materi pertama Anda.
                  </div>
                )}
              </div>
            </main>
          </div>
        );
      };

      return (
        <div className="p-4 sm:p-6 min-h-screen">
          {notification && (
            <div className="fixed bottom-4 right-4 z-50 bg-blue-600 text-white px-4 py-3 rounded-2xl shadow-2xl border border-blue-400 text-xs font-bold animate-bounce flex items-center gap-2">
              <CheckCircle className="w-4 h-4"/> {notification}
            </div>
          )}
          {renderTeacherContent()}
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = createRoot(container);
    root.render(<AppWrapper />);
  </script>
</body>
</html>
