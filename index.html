<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal E-Learning Multimapel</title>

  <!-- Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SheetJS / XLSX CDN untuk Export Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- KaTeX CDN untuk Render Simbol Matematika/Sains -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

  <!-- Babel Standalone untuk JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    .rich-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0;
    }
    .rich-content th, .rich-content td {
      border: 1px solid #334155;
      padding: 6px 10px;
      text-align: left;
    }
    .rich-content th {
      background-color: #1e293b;
    }
  </style>

  <!-- Import Map untuk React, Firebase, dan Lucide Icons -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1"
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-blue-500 selection:text-white pb-20 md:pb-0">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInAnonymously, signInWithCustomToken } from 'firebase/auth';
    import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from 'firebase/firestore';
    import { 
      BookOpen, Users, LogIn, FileText, PlusCircle, CheckCircle, 
      Award, ArrowLeft, LogOut, List, Trash2, Filter, Upload, Lock, UserPlus,
      Clock, AlertTriangle, RefreshCw, Radio, Download, LayoutDashboard, StopCircle, User, Edit, Image, Code, FileSpreadsheet, Play, Power, AlertCircle, X, Home, BookMarked, Gamepad2, ExternalLink
    } from 'lucide-react';

    const MAPEL_LIST = [
      "IPA", "IPS", "MATEMATIKA", "PAI", "BAHASA INDONESIA", 
      "BAHASA INGGRIS", "PJOK", "SENI BUDAYA", "TIK", "BAHASA MADURA"
    ];

    const firebaseConfig = {
      apiKey: "AIzaSyD3M8FfqHdzCRO3VCKB24xPEcEZgVVK--M",
      authDomain: "gen-lang-client-0031221493.firebaseapp.com",
      databaseURL: "https://gen-lang-client-0031221493-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gen-lang-client-0031221493",
      storageBucket: "gen-lang-client-0031221493.firebasestorage.app",
      messagingSenderId: "514951591302",
      appId: "1:514951591302:web:65d128106e2d2f3663e807",
      measurementId: "G-VF7M8CDSYQ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'elearning-multimapel-v4';

    const broadcast = typeof window !== 'undefined' && 'BroadcastChannel' in window
      ? new BroadcastChannel('elearning_multimapel_realtime_channel')
      : null;

    function getSafeImageUrl(url) {
      if (!url) return '';
      if (url.startsWith('data:image')) return url;
      return url;
    }

    function RenderMathText({ text }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (containerRef.current && window.katex) {
          try {
            const raw = text || '';
            let formatted = raw.replace(/\$\$(.*?)\$\$/g, (m, expr) => {
              try { return window.katex.renderToString(expr, { displayMode: true }); } catch (e) { return expr; }
            });
            formatted = formatted.replace(/\$(.*?)\$/g, (m, expr) => {
              try { return window.katex.renderToString(expr, { displayMode: false }); } catch (e) { return expr; }
            });
            containerRef.current.innerHTML = formatted;
          } catch (err) {
            containerRef.current.innerText = text;
          }
        }
      }, [text]);

      return <div ref={containerRef} className="rich-content whitespace-pre-wrap leading-relaxed inline-block w-full" />;
    }

    const defaultMaterials = [
      { 
        id: 'm1', 
        title: 'Mengenal Kebutuhan Manusia & Kelangkaan Sumber Daya', 
        mapel: 'IPS',
        kelas: '7', 
        subKelasTarget: 'semua', 
        semester: '1', 
        durationMinutes: 15,
        content: `Kebutuhan manusia merupakan aspek esensial yang harus dipenuhi untuk mempertahankan kelangsungan hidup.\n\nContoh urutan kebutuhan:\n1. Kebutuhan Primer\n2. Kebutuhan Sekunder\n3. Kebutuhan Tersier`, 
        imageUrl: 'https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=800&q=80',
        gameUrl: 'https://wordwall.net/embed/play/277/123/456',
        source: 'Buku Paket IPS SMP Kelas 7 Bab 1',
        createdBy: 'Dra. Hj. Siti Rahmah, M.Pd.',
        nipGuru: '197508122000032001',
        createdAt: Date.now()
      },
      {
        id: 'm2',
        title: 'Persamaan Garis Lurus & Teorema Pythagoras',
        mapel: 'MATEMATIKA',
        kelas: '8',
        subKelasTarget: 'semua',
        semester: '1',
        durationMinutes: 20,
        content: `Pembahasan dasar rumus Pythagoras $a^2 + b^2 = c^2$ serta persamaan garis $y = mx + c$.`,
        imageUrl: 'https://images.unsplash.com/photo-1509228468518-180dd4864904?auto=format&fit=crop&w=800&q=80',
        gameUrl: '',
        source: 'Buku Paket Matematika Kelas 8',
        createdBy: 'Bambang Gunawan, S.Pd., M.Si.',
        nipGuru: '198203152005011002',
        createdAt: Date.now() - 86400000
      }
    ];

    const defaultQuestions = [
      { id: 'q1', materialId: 'm1', mapel: 'IPS', type: 'pg', questionText: 'Makanan, pakaian, dan tempat tinggal termasuk dalam jenis kebutuhan...', optionA: 'Primer', optionB: 'Sekunder', optionC: 'Tersier', optionD: 'Jasmani', correctAnswer: 'A' },
      { id: 'q2', materialId: 'm2', mapel: 'MATEMATIKA', type: 'pg', questionText: 'Berapakah nilai $c$ jika $a = 3$ dan $b = 4$ pada rumus $c = \\sqrt{a^2 + b^2}$?', optionA: '5', optionB: '6', optionC: '7', optionD: '8', correctAnswer: 'A', questionImage: 'https://images.unsplash.com/photo-1635070041078-e363dbe005cb?auto=format&fit=crop&w=600&q=80' }
    ];

    const defaultStudents = [
      { id: 's1', name: 'Ahmad Rizky Pratama', kelas: '7', subKelas: 'A' },
      { id: 's2', name: 'Anisa Rahmawati', kelas: '7', subKelas: 'A' },
      { id: 's3', name: 'Budi Santoso', kelas: '8', subKelas: 'A' },
      { id: 's4', name: 'Citra Dewi Kartika', kelas: '9', subKelas: 'A' }
    ];

    // --- COMPONENT PORTAL SISWA ---
    function StudentApp({ onBackToRoleSelect }) {
      const [students, setStudents] = useState([]);
      const [materials, setMaterials] = useState([]);
      const [questions, setQuestions] = useState([]);
      
      const [selectedMapel, setSelectedMapel] = useState('IPA');
      const [selectedKelas, setSelectedKelas] = useState('7');
      const [selectedSubKelas, setSelectedSubKelas] = useState('A');
      const [studentSession, setStudentSession] = useState(null);
      const [selectedStudentId, setSelectedStudentId] = useState('');
      
      const [activeMaterial, setActiveMaterial] = useState(null);
      const [timer, setTimer] = useState(0);
      const [isReading, setIsReading] = useState(false);
      const [isTabFocused, setIsTabFocused] = useState(true);

      const [userAnswers, setUserAnswers] = useState({});
      const [quizResult, setQuizResult] = useState(null);

      useEffect(() => {
        signInAnonymously(auth).catch(() => {});

        const unsubStudents = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'students'), (snap) => {
          const list = [];
          snap.docs.forEach(doc => list.push(doc.data()));
          setStudents(list.length > 0 ? list : defaultStudents);
        });

        const unsubMaterials = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'materials'), (snap) => {
          const list = [];
          snap.docs.forEach(doc => list.push(doc.data()));
          setMaterials(list.length > 0 ? list : defaultMaterials);
        });

        const unsubQuestions = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'questions'), (snap) => {
          const list = [];
          snap.docs.forEach(doc => list.push(doc.data()));
          setQuestions(list.length > 0 ? list : defaultQuestions);
        });

        return () => {
          unsubStudents();
          unsubMaterials();
          unsubQuestions();
        };
      }, []);

      useEffect(() => {
        const handleFocus = () => {
          setIsTabFocused(true);
          if (isReading && timer > 0) updatePresence(timer, 'Sedang Belajar');
        };

        const handleBlur = () => {
          setIsTabFocused(false);
          if (isReading && timer > 0) updatePresence(timer, 'Membuka Tab Lain');
        };

        window.addEventListener('focus', handleFocus);
        window.addEventListener('blur', handleBlur);

        return () => {
          window.removeEventListener('focus', handleFocus);
          window.removeEventListener('blur', handleBlur);
        };
      }, [isReading, timer]);

      const availableStudents = students.filter(s => s.kelas === selectedKelas && s.subKelas === selectedSubKelas);

      const handleStudentLogin = (e) => {
        e.preventDefault();
        const found = students.find(s => s.id === selectedStudentId);
        if (found) {
          setStudentSession(found);
        }
      };

      useEffect(() => {
        let interval = null;
        if (isReading && timer > 0) {
          interval = setInterval(() => {
            setTimer(prev => {
              const newTime = prev - 1;
              const currentStatus = isTabFocused ? 'Sedang Belajar' : 'Membuka Tab Lain';
              updatePresence(newTime, currentStatus);
              return newTime;
            });
          }, 1000);
        } else if (timer === 0 && isReading) {
          setIsReading(false);
          updatePresence(0, 'Selesai');
        }
        return () => clearInterval(interval);
      }, [isReading, timer, isTabFocused]);

      const updatePresence = async (remSecs, status) => {
        if (!studentSession || !activeMaterial) return;
        const presKey = `${studentSession.id}_${activeMaterial.id}`;
        const presData = {
          id: presKey,
          studentId: studentSession.id,
          studentName: studentSession.name,
          kelas: studentSession.kelas,
          subKelas: studentSession.subKelas,
          materialId: activeMaterial.id,
          materialTitle: activeMaterial.title,
          mapel: activeMaterial.mapel || 'UMUM',
          remainingSeconds: remSecs,
          status: status,
          lastUpdated: Date.now()
        };

        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_presence', presKey);
          await setDoc(docRef, presData);
        } catch (e) {}

        if (broadcast) {
          broadcast.postMessage({ type: 'STUDENT_PRESENCE_UPDATE', payload: presData });
        }
      };

      const startReading = (mat) => {
        setActiveMaterial(mat);
        setUserAnswers({});
        setQuizResult(null);
        const durationSecs = (mat.durationMinutes || 15) * 60;
        setTimer(durationSecs);
        setIsReading(true);
      };

      const handleSubmitQuiz = async (e) => {
        e.preventDefault();
        const currentQuestions = questions.filter(q => q.materialId === activeMaterial.id);
        if (currentQuestions.length === 0) return;

        let correctCount = 0;
        currentQuestions.forEach(q => {
          const ans = (userAnswers[q.id] || '').trim().toLowerCase();
          const target = (q.correctAnswer || '').trim().toLowerCase();
          if (ans === target) {
            correctCount++;
          }
        });

        const calculatedScore = Math.round((correctCount / currentQuestions.length) * 100);
        
        const scoreData = {
          id: `sc_${Date.now()}_${studentSession.id}`,
          studentId: studentSession.id,
          studentName: studentSession.name,
          kelas: studentSession.kelas,
          subKelas: studentSession.subKelas,
          materialId: activeMaterial.id,
          materialTitle: activeMaterial.title,
          mapel: activeMaterial.mapel || 'UMUM',
          score: calculatedScore,
          totalQuestions: currentQuestions.length,
          correctAnswers: correctCount,
          submittedAt: Date.now()
        };

        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'scores', scoreData.id);
          await setDoc(docRef, scoreData);
        } catch (e) {}

        const localScores = JSON.parse(localStorage.getItem('elearning_scores_v4') || '[]');
        localStorage.setItem('elearning_scores_v4', JSON.stringify([scoreData, ...localScores]));

        setQuizResult(scoreData);
      };

      if (!studentSession) {
        return (
          <div className="min-h-screen bg-slate-950 flex flex-col justify-center items-center p-4">
            <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative">
              <button onClick={onBackToRoleSelect} className="absolute top-4 left-4 text-xs text-slate-400 hover:text-white flex items-center gap-1">
                <ArrowLeft className="w-4 h-4"/> Ganti Akses
              </button>
              
              <div className="text-center mt-4 mb-6">
                <div className="inline-flex p-3 bg-blue-600 rounded-2xl mb-2">
                  <User className="w-8 h-8 text-white" />
                </div>
                <h1 className="text-xl font-extrabold text-white">Portal Siswa E-Learning</h1>
                <p className="text-slate-400 text-xs mt-1">Pilih Kelas dan Nama Anda untuk Masuk</p>
              </div>

              <form onSubmit={handleStudentLogin} className="space-y-4">
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Kelas</label>
                    <select value={selectedKelas} onChange={(e) => setSelectedKelas(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
                      <option value="7">Kelas 7</option>
                      <option value="8">Kelas 8</option>
                      <option value="9">Kelas 9</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Rombel</label>
                    <select value={selectedSubKelas} onChange={(e) => setSelectedSubKelas(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
                      <option value="A">Rombel A</option>
                      <option value="B">Rombel B</option>
                      <option value="C">Rombel C</option>
                      <option value="D">Rombel D</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1">Pilih Nama Siswa</label>
                  <select 
                    value={selectedStudentId} 
                    onChange={(e) => setSelectedStudentId(e.target.value)}
                    required 
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white"
                  >
                    <option value="">-- Pilih Nama Anda --</option>
                    {availableStudents.map(s => (
                      <option key={s.id} value={s.id}>{s.name}</option>
                    ))}
                  </select>
                  {availableStudents.length === 0 && (
                    <p className="text-[10px] text-amber-400 mt-1">Nama siswa belum diupload oleh Guru untuk kelas ini.</p>
                  )}
                </div>

                <button type="submit" disabled={!selectedStudentId} className="w-full bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-bold py-3 rounded-xl transition-all shadow-lg text-xs">
                  Masuk Portal Belajar
                </button>
              </form>
            </div>
          </div>
        );
      }

      const filteredMaterialsForStudent = materials.filter(m => 
        String(m.kelas) === String(studentSession.kelas) && 
        (m.mapel === selectedMapel)
      );

      const activeMaterialQuestions = activeMaterial 
        ? questions.filter(q => q.materialId === activeMaterial.id) 
        : [];

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 p-4 max-w-5xl mx-auto">
          <header className="flex justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-2xl mb-6">
            <div>
              <h2 className="font-bold text-white text-sm">{studentSession.name}</h2>
              <p className="text-slate-400 text-xs">Kelas {studentSession.kelas} - Rombel {studentSession.subKelas}</p>
            </div>
            <button onClick={() => setStudentSession(null)} className="text-red-400 hover:text-red-300 text-xs font-semibold flex items-center gap-1 bg-red-500/10 px-3 py-2 rounded-xl border border-red-500/20">
              <LogOut className="w-3.5 h-3.5"/> Keluar
            </button>
          </header>

          <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl mb-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div className="flex items-center gap-2">
              <Filter className="w-4 h-4 text-blue-400" />
              <span className="text-xs font-bold text-slate-200">Pilih Mata Pelajaran:</span>
            </div>
            <div className="flex flex-wrap gap-2">
              {MAPEL_LIST.map(mp => (
                <button
                  key={mp}
                  onClick={() => { setSelectedMapel(mp); setActiveMaterial(null); }}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all ${selectedMapel === mp ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'bg-slate-950 text-slate-400 hover:text-white border border-slate-800'}`}
                >
                  {mp}
                </button>
              ))}
            </div>
          </div>

          {activeMaterial ? (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-6">
              <button onClick={() => { setIsReading(false); setActiveMaterial(null); setQuizResult(null); setUserAnswers({}); updatePresence(0, 'Selesai'); }} className="text-xs text-slate-400 hover:text-white flex items-center gap-1">
                <ArrowLeft className="w-4 h-4"/> Kembali ke Daftar Materi
              </button>

              <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                <div>
                  <span className="text-[10px] bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2 py-0.5 rounded font-bold">{activeMaterial.mapel}</span>
                  <h1 className="text-lg font-bold text-white mt-1">{activeMaterial.title}</h1>
                  <p className="text-xs text-slate-400">Pengajar: {activeMaterial.createdBy}</p>
                </div>
                <div className="bg-amber-500/20 text-amber-300 border border-amber-500/30 font-mono font-bold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5">
                  <Clock className="w-4 h-4 text-amber-400"/>
                  {Math.floor(timer / 60)}:{(timer % 60).toString().padStart(2, '0')}
                </div>
              </div>

              {activeMaterial.imageUrl && (
                <div className="flex justify-center bg-slate-950/50 p-2 rounded-xl border border-slate-800">
                  <img 
                    src={getSafeImageUrl(activeMaterial.imageUrl)} 
                    alt={activeMaterial.title} 
                    referrerPolicy="no-referrer"
                    onError={(e) => {
                      if (!e.target.dataset.tried) {
                        e.target.dataset.tried = 'true';
                        e.target.src = `https://images.weserv.nl/?url=${encodeURIComponent(activeMaterial.imageUrl)}`;
                      }
                    }}
                    className="max-w-full h-auto object-contain rounded-xl"
                  />
                </div>
              )}

              {/* ISI TEKS MATERI */}
              <div className="text-slate-300 text-xs font-sans">
                <RenderMathText text={activeMaterial.content} />
              </div>

              {/* GAME INTERAKTIF (LINK BUKA TAB BARU) */}
              {activeMaterial.gameUrl && (
                <div className="bg-slate-950 border border-purple-500/30 rounded-2xl p-4 flex items-center justify-between gap-4">
                  <div className="flex items-center gap-3">
                    <div className="p-2.5 bg-purple-500/10 rounded-xl border border-purple-500/20">
                      <Gamepad2 className="w-6 h-6 text-purple-400 animate-bounce" />
                    </div>
                    <div>
                      <h3 className="text-xs sm:text-sm font-bold text-white">Game & Edukasi Interaktif</h3>
                      <p className="text-[11px] text-slate-400 mt-0.5">Klik tombol di samping untuk memainkan game pembelajaran ini.</p>
                    </div>
                  </div>
                  <a 
                    href={activeMaterial.gameUrl} 
                    target="_blank" 
                    rel="noopener noreferrer"
                    className="shrink-0 text-xs text-white bg-purple-600 hover:bg-purple-500 flex items-center gap-2 px-4 py-2.5 rounded-xl font-bold shadow-lg shadow-purple-600/30 transition-all"
                  >
                    Buka Game di Tab Baru <ExternalLink className="w-4 h-4"/>
                  </a>
                </div>
              )}

              {/* SUMBER REFERENSI MATERI */}
              {activeMaterial.source && (
                <div className="bg-slate-950/80 border border-slate-800 p-3 rounded-xl flex items-center gap-2 text-xs text-slate-400">
                  <BookMarked className="w-4 h-4 text-blue-400 shrink-0" />
                  <div>
                    <span className="font-bold text-slate-300">Sumber Referensi: </span>
                    <span>{activeMaterial.source}</span>
                  </div>
                </div>
              )}

              {/* LATIHAN SOAL LANGSUNG DI BAWAH MATERI */}
              <div className="pt-6 border-t border-slate-800 space-y-6">
                <div className="flex items-center gap-2">
                  <List className="w-5 h-5 text-emerald-400" />
                  <h2 className="text-base font-bold text-white">Latihan Soal & Evaluasi</h2>
                </div>

                {quizResult ? (
                  <div className="text-center p-8 bg-slate-950 border border-slate-800 rounded-2xl space-y-4">
                    <Award className="w-16 h-16 text-amber-400 mx-auto" />
                    <h3 className="text-xl font-bold text-white">Hasil Latihan Soal</h3>
                    <div className="text-4xl font-extrabold text-blue-400">{quizResult.score} / 100</div>
                    <p className="text-xs text-slate-400">
                      Jawaban Benar: {quizResult.correctAnswers} dari {quizResult.totalQuestions} Soal
                    </p>
                    <button 
                      onClick={() => { setIsReading(false); setActiveMaterial(null); setQuizResult(null); setUserAnswers({}); updatePresence(0, 'Selesai'); }}
                      className="bg-blue-600 hover:bg-blue-500 text-white font-bold px-6 py-2.5 rounded-xl text-xs transition-all mt-4"
                    >
                      Selesai & Kembali ke Daftar Materi
                    </button>
                  </div>
                ) : (
                  <form onSubmit={handleSubmitQuiz} className="space-y-6">
                    {activeMaterialQuestions.map((q, idx) => (
                      <div key={q.id} className="bg-slate-950 border border-slate-800 p-4 sm:p-5 rounded-2xl space-y-3">
                        <div className="font-bold text-white text-xs leading-relaxed flex items-start gap-2">
                          <span>{idx + 1}.</span>
                          <div className="flex-1"><RenderMathText text={q.questionText} /></div>
                        </div>

                        {q.questionImage && (
                          <img 
                            src={getSafeImageUrl(q.questionImage)} 
                            alt="Soal Gambar" 
                            referrerPolicy="no-referrer"
                            onError={(e) => {
                              if (!e.target.dataset.tried) {
                                e.target.dataset.tried = 'true';
                                e.target.src = `https://images.weserv.nl/?url=${encodeURIComponent(q.questionImage)}`;
                              }
                            }}
                            className="max-h-56 rounded-xl border border-slate-800 my-2 object-contain" 
                          />
                        )}

                        {q.type === 'pg' ? (
                          <div className="space-y-2">
                            {['A', 'B', 'C', 'D'].map((optKey) => {
                              const optText = q[`option${optKey}`];
                              if (!optText) return null;
                              return (
                                <label key={optKey} className={`flex items-center gap-3 p-3 rounded-xl border text-xs cursor-pointer transition-all ${userAnswers[q.id] === optKey ? 'bg-blue-600/20 border-blue-500 text-white' : 'bg-slate-900 border-slate-800 text-slate-300 hover:border-slate-700'}`}>
                                  <input 
                                    type="radio" 
                                    name={`q_${q.id}`} 
                                    value={optKey} 
                                    checked={userAnswers[q.id] === optKey}
                                    onChange={() => setUserAnswers(prev => ({ ...prev, [q.id]: optKey }))}
                                    className="accent-blue-500 h-4 w-4"
                                    required
                                  />
                                  <div className="flex-1">
                                    <RenderMathText text={optText} />
                                  </div>
                                </label>
                              );
                            })}
                          </div>
                        ) : (
                          <div>
                            <input 
                              type="text" 
                              required
                              placeholder="Tuliskan jawaban singkat Anda di sini..."
                              value={userAnswers[q.id] || ''}
                              onChange={(e) => setUserAnswers(prev => ({ ...prev, [q.id]: e.target.value }))}
                              className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white focus:border-blue-500 outline-none"
                            />
                          </div>
                        )}
                      </div>
                    ))}

                    {activeMaterialQuestions.length === 0 ? (
                      <div className="p-8 text-center text-slate-500 bg-slate-950 rounded-2xl border border-slate-800 text-xs">
                        Belum ada soal latihan yang dibuat oleh guru untuk materi ini.
                      </div>
                    ) : (
                      <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition-all text-xs shadow-lg shadow-emerald-600/30">
                        Kirim Jawaban & Lihat Nilai
                      </button>
                    )}
                  </form>
                )}
              </div>
            </div>
          ) : (
            <div className="space-y-4">
              <h3 className="font-bold text-white text-sm flex items-center gap-2">
                <BookOpen className="w-4 h-4 text-blue-500"/> Materi {selectedMapel} Kelas {studentSession.kelas}
              </h3>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {filteredMaterialsForStudent.map(m => {
                  const qCount = questions.filter(q => q.materialId === m.id).length;
                  return (
                    <div key={m.id} className="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col justify-between">
                      <div>
                        {m.imageUrl && (
                          <div className="h-36 bg-slate-950 overflow-hidden rounded-xl mb-3 flex items-center justify-center">
                            <img 
                              src={getSafeImageUrl(m.imageUrl)} 
                              alt={m.title} 
                              referrerPolicy="no-referrer"
                              onError={(e) => {
                                if (!e.target.dataset.tried) {
                                  e.target.dataset.tried = 'true';
                                  e.target.src = `https://images.weserv.nl/?url=${encodeURIComponent(m.imageUrl)}`;
                                }
                              }}
                              className="max-h-full max-w-full object-contain" 
                            />
                          </div>
                        )}
                        <div className="flex justify-between items-center">
                          <span className="text-[10px] bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2 py-0.5 rounded-lg font-bold">
                            {m.mapel} • Kelas {m.kelas}
                          </span>
                          {m.gameUrl && (
                            <span className="text-[10px] bg-purple-500/10 text-purple-400 border border-purple-500/20 px-2 py-0.5 rounded-lg font-bold flex items-center gap-1">
                              <Gamepad2 className="w-3 h-3" /> Ada Game
                            </span>
                          )}
                        </div>
                        <h4 className="font-bold text-white text-sm mt-2">{m.title}</h4>
                        <div className="text-slate-400 text-xs line-clamp-2 mt-1">
                          <RenderMathText text={m.content} />
                        </div>
                      </div>

                      <div className="mt-4">
                        <button 
                          onClick={() => startReading(m)} 
                          className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-xs transition-all flex justify-center items-center gap-2 shadow-lg"
                        >
                          <BookOpen className="w-3.5 h-3.5"/> Pelajari Materi & Latihan Soal ({qCount})
                        </button>
                      </div>
                    </div>
                  );
                })}

                {filteredMaterialsForStudent.length === 0 && (
                  <div className="col-span-full p-8 text-center text-slate-500 bg-slate-900/50 rounded-2xl border border-slate-800 text-xs">
                    Belum ada materi terbit untuk Mata Pelajaran <strong className="text-white">{selectedMapel}</strong> di Kelas {studentSession.kelas}.
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- MAIN WRAPPER ---
    function AppWrapper() {
      const [role, setRole] = useState(null);

      if (!role) {
        return (
          <div className="min-h-screen bg-slate-950 flex flex-col justify-center items-center p-4">
            <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center shadow-2xl">
              <h1 className="text-2xl font-extrabold text-white mb-2">Portal E-Learning Pembelajaran</h1>
              <p className="text-slate-400 text-xs mb-8">Pilih akses masuk portal perangkat Anda</p>

              <div className="space-y-4">
                <button 
                  onClick={() => setRole('siswa')}
                  className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-4 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-3 text-sm"
                >
                  <User className="w-5 h-5"/> Masuk Sebagai Siswa
                </button>

                <button 
                  onClick={() => setRole('guru')}
                  className="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-4 rounded-2xl border border-slate-700 transition-all flex items-center justify-center gap-3 text-sm"
                >
                  <Lock className="w-5 h-5 text-blue-400"/> Masuk Dashboard Guru
                </button>
              </div>
            </div>
          </div>
        );
      }

      if (role === 'siswa') {
        return <StudentApp onBackToRoleSelect={() => setRole(null)} />;
      }

      return (
        <div>
          <div className="bg-slate-900 border-b border-slate-800 px-4 py-2 flex justify-between items-center text-xs">
            <span className="text-slate-400">Akses: <strong className="text-blue-400">Portal Guru Mapel</strong></span>
            <button onClick={() => setRole(null)} className="text-slate-400 hover:text-white underline text-[11px]">Ganti Akses</button>
          </div>
          <TeacherApp />
        </div>
      );
    }

    // --- COMPONENT PORTAL GURU ---
    function TeacherApp() {
      const [appSession, setAppSession] = useState(() => {
        const saved = localStorage.getItem('elearning_guru_session_v4');
        return saved ? JSON.parse(saved) : null;
      });

      const [materials, setMaterials] = useState(() => {
        const local = localStorage.getItem('elearning_materials_v4');
        return local ? JSON.parse(local) : defaultMaterials;
      });

      const [questions, setQuestions] = useState(() => {
        const local = localStorage.getItem('elearning_questions_v4');
        return local ? JSON.parse(local) : defaultQuestions;
      });

      const [students, setStudents] = useState(() => {
        const local = localStorage.getItem('elearning_students_v4');
        return local ? JSON.parse(local) : defaultStudents;
      });

      const [scores, setScores] = useState(() => {
        const local = localStorage.getItem('elearning_scores_v4');
        return local ? JSON.parse(local) : [];
      });

      const [liveMonitorData, setLiveMonitorData] = useState(() => {
        const local = localStorage.getItem('elearning_live_monitor');
        return local ? JSON.parse(local) : {};
      });

      const [activeTab, setActiveTab] = useState('dashboard');
      const [selectedMaterial, setSelectedMaterial] = useState(null);
      const [editingMaterial, setEditingMaterial] = useState(null);
      const [editingQuestion, setEditingQuestion] = useState(null);
      const [formQuestionType, setFormQuestionType] = useState('pg');
      const [notification, setNotification] = useState(null);

      const [loginNamaGelar, setLoginNamaGelar] = useState('');
      const [loginNip, setLoginNip] = useState('');
      const [loginSelectedMapel, setLoginSelectedMapel] = useState('IPA');

      const [studentInputKelas, setStudentInputKelas] = useState('7');
      const [studentInputSubKelas, setStudentInputSubKelas] = useState('A');
      const [rawStudentNames, setRawStudentNames] = useState('');

      const [batchQuestionsText, setBatchQuestionsText] = useState('');

      const [manageStudentClass, setManageStudentClass] = useState('7');
      const [manageStudentSubClass, setManageStudentSubClass] = useState('A');
      const [filterClassGuru, setFilterClassGuru] = useState('semua');

      const [rekapFilterClass, setRekapFilterClass] = useState('semua');
      const [rekapFilterSubClass, setRekapFilterSubClass] = useState('semua');

      useEffect(() => {
        if (editingQuestion) {
          setFormQuestionType(editingQuestion.type || 'pg');
        } else {
          setFormQuestionType('pg');
        }
      }, [editingQuestion]);

      useEffect(() => { localStorage.setItem('elearning_materials_v4', JSON.stringify(materials)); }, [materials]);
      useEffect(() => { localStorage.setItem('elearning_questions_v4', JSON.stringify(questions)); }, [questions]);
      useEffect(() => { localStorage.setItem('elearning_students_v4', JSON.stringify(students)); }, [students]);
      useEffect(() => { localStorage.setItem('elearning_scores_v4', JSON.stringify(scores)); }, [scores]);
      useEffect(() => { localStorage.setItem('elearning_live_monitor', JSON.stringify(liveMonitorData)); }, [liveMonitorData]);

      useEffect(() => {
        if (appSession) {
          localStorage.setItem('elearning_guru_session_v4', JSON.stringify(appSession));
        } else {
          localStorage.removeItem('elearning_guru_session_v4');
        }
      }, [appSession]);

      useEffect(() => {
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (e) {}
        };
        initAuth();

        try {
          const materialsCol = collection(db, 'artifacts', appId, 'public', 'data', 'materials');
          const unsubMat = onSnapshot(materialsCol, (snapshot) => {
            const remoteMat = [];
            snapshot.docs.forEach(doc => remoteMat.push(doc.data()));
            if (remoteMat.length > 0) setMaterials(remoteMat);
          });

          const questionsCol = collection(db, 'artifacts', appId, 'public', 'data', 'questions');
          const unsubQ = onSnapshot(questionsCol, (snapshot) => {
            const remoteQ = [];
            snapshot.docs.forEach(doc => remoteQ.push(doc.data()));
            if (remoteQ.length > 0) setQuestions(remoteQ);
          });

          const presenceCol = collection(db, 'artifacts', appId, 'public', 'data', 'student_presence');
          const unsubPresence = onSnapshot(presenceCol, (snapshot) => {
            const remotePresences = {};
            snapshot.docs.forEach(doc => { remotePresences[doc.id] = doc.data(); });
            if (Object.keys(remotePresences).length > 0) setLiveMonitorData(prev => ({ ...prev, ...remotePresences }));
          });

          const studentsCol = collection(db, 'artifacts', appId, 'public', 'data', 'students');
          const unsubStudents = onSnapshot(studentsCol, (snapshot) => {
            const remoteStudents = [];
            snapshot.docs.forEach(doc => remoteStudents.push(doc.data()));
            if (remoteStudents.length > 0) setStudents(remoteStudents);
          });

          const scoresCol = collection(db, 'artifacts', appId, 'public', 'data', 'scores');
          const unsubScores = onSnapshot(scoresCol, (snapshot) => {
            const remoteScores = [];
            snapshot.docs.forEach(doc => remoteScores.push(doc.data()));
            if (remoteScores.length > 0) setScores(remoteScores);
          });

          return () => {
            unsubMat();
            unsubQ();
            unsubPresence();
            unsubStudents();
            unsubScores();
          };
        } catch (err) {}
      }, []);

      const showNotification = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(null), 4000);
      };

      const handleGuruLogin = (e) => {
        e.preventDefault();
        if (!loginNamaGelar.trim() || !loginNip.trim()) {
          showNotification("Nama Lengkap dengan Gelar dan NIP Wajib Diisi!");
          return;
        }

        const guruSession = {
          fullName: loginNamaGelar.trim(),
          nip: loginNip.trim(),
          mapel: loginSelectedMapel
        };

        setAppSession(guruSession);
        setActiveTab('dashboard');
        showNotification(`Selamat Datang, ${guruSession.fullName} (${guruSession.mapel})!`);
      };

      const handleLogout = () => {
        setAppSession(null);
        setActiveTab('dashboard');
        setSelectedMaterial(null);
        setEditingMaterial(null);
        setEditingQuestion(null);
      };

      const handleCreateMaterial = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);

        const title = formData.get('title');
        const kelas = formData.get('kelas');
        const subKelasTarget = formData.get('subKelasTarget');
        const semester = formData.get('semester');
        const durationMinutes = parseInt(formData.get('durationMinutes')) || 15;
        const content = formData.get('content');
        const imageUrl = formData.get('imageUrl') || '';
        const gameUrl = formData.get('gameUrl') || '';
        const source = formData.get('source') || '';

        if (!title || !content) {
          showNotification("Judul dan Teks Isi Materi Wajib Diisi!");
          return;
        }

        const newMat = {
          id: 'mat_' + Date.now(),
          title,
          mapel: appSession.mapel,
          kelas,
          subKelasTarget,
          semester,
          durationMinutes,
          content,
          imageUrl,
          gameUrl,
          source,
          createdBy: appSession.fullName,
          nipGuru: appSession.nip,
          createdAt: Date.now()
        };

        setMaterials(prev => [newMat, ...prev]);

        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'materials', newMat.id);
          await setDoc(docRef, newMat);
          showNotification(`Materi "${title}" berhasil diterbitkan untuk Mapel ${appSession.mapel}!`);
        } catch (err) {
          showNotification(`Materi tersimpan di penyimpanan lokal.`);
        }

        e.target.reset();
        setActiveTab('dashboard');
      };

      const handleUpdateMaterial = async (e) => {
        e.preventDefault();
        if (!editingMaterial) return;

        const formData = new FormData(e.target);
        const title = formData.get('title');
        const kelas = formData.get('kelas');
        const subKelasTarget = formData.get('subKelasTarget');
        const semester = formData.get('semester');
        const durationMinutes = parseInt(formData.get('durationMinutes')) || 15;
        const content = formData.get('content');
        const imageUrl = formData.get('imageUrl') || '';
        const gameUrl = formData.get('gameUrl') || '';
        const source = formData.get('source') || '';

        const updatedMat = {
          ...editingMaterial,
          title,
          kelas,
          subKelasTarget,
          semester,
          durationMinutes,
          content,
          imageUrl,
          gameUrl,
          source,
          updatedAt: Date.now()
        };

        setMaterials(prev => prev.map(m => m.id === editingMaterial.id ? updatedMat : m));

        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'materials', updatedMat.id);
          await setDoc(docRef, updatedMat);
          showNotification(`Materi diperbarui.`);
        } catch (err) {}

        setEditingMaterial(null);
        setActiveTab('dashboard');
      };

      const handleDeleteMaterial = async (id) => {
        if (!window.confirm("Apakah Anda yakin ingin menghapus materi ini beserta seluruh soalnya?")) return;
        
        setMaterials(prev => prev.filter(m => m.id !== id));
        setQuestions(prev => prev.filter(q => q.materialId !== id));

        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'materials', id);
          await deleteDoc(docRef);

          const questionsToDelete = questions.filter(q => q.materialId === id);
          for (const q of questionsToDelete) {
            const qRef = doc(db, 'artifacts', appId, 'public', 'data', 'questions', q.id);
            await deleteDoc(qRef);
          }
        } catch (e) {}

        showNotification("Materi beserta soal terkait telah dihapus permanen.");
      };

      const handleSaveQuestion = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const qType = formQuestionType;

        const isEditing = Boolean(editingQuestion);

        const targetQ = {
          id: isEditing ? editingQuestion.id : ('q_' + Date.now()),
          materialId: selectedMaterial.id,
          mapel: appSession.mapel,
          type: qType,
          questionText: formData.get('questionText'),
          questionImage: formData.get('questionImage') || '',
          createdAt: isEditing ? editingQuestion.createdAt : Date.now(),
          updatedAt: Date.now()
        };

        if (qType === 'pg') {
          targetQ.optionA = formData.get('optionA') || '';
          targetQ.optionB = formData.get('optionB') || '';
          targetQ.optionC = formData.get('optionC') || '';
          targetQ.optionD = formData.get('optionD') || '';
          targetQ.correctAnswer = formData.get('correctAnswer') || 'A';
        } else {
          targetQ.correctAnswer = formData.get('correctAnswerIsian') || '';
        }

        if (isEditing) {
          setQuestions(prev => prev.map(q => q.id === targetQ.id ? targetQ : q));
        } else {
          setQuestions(prev => [...prev, targetQ]);
        }

        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'questions', targetQ.id);
          await setDoc(docRef, targetQ);
          showNotification(isEditing ? "Soal berhasil diperbarui!" : "Soal berhasil ditambahkan!");
        } catch (err) {}

        e.target.reset();
        setEditingQuestion(null);
        setFormQuestionType('pg');
      };

      const handleBatchPasteQuestions = async (e) => {
        e.preventDefault();
        if (!batchQuestionsText.trim() || !selectedMaterial) return;

        const text = batchQuestionsText.trim();
        const rawBlocks = text.split(/\n\s*\n/).map(b => b.trim()).filter(b => b !== '');
        
        const newParsedQuestions = [];
        let baseTime = Date.now();

        rawBlocks.forEach((blockText, idx) => {
          const lines = blockText.split('\n').map(l => l.trim()).filter(l => l !== '');
          if (lines.length === 0) return;

          let questionParts = [];
          let optA = '', optB = '', optC = '', optD = '';
          let answer = 'A';

          lines.forEach((line) => {
            if (/^[aA][\.\)]\s*/.test(line)) {
              optA = line.replace(/^[aA][\.\)]\s*/, '').trim();
            } else if (/^[bB][\.\)]\s*/.test(line)) {
              optB = line.replace(/^[bB][\.\)]\s*/, '').trim();
            } else if (/^[cC][\.\)]\s*/.test(line)) {
              optC = line.replace(/^[cC][\.\)]\s*/, '').trim();
            } else if (/^[dD][\.\)]\s*/.test(line)) {
              optD = line.replace(/^[dD][\.\)]\s*/, '').trim();
            } else if (/^(kunci|jawaban|ans|key)\s*:\s*/i.test(line)) {
              const matched = line.match(/(A|B|C|D)/i);
              if (matched) {
                answer = matched[1].toUpperCase();
              } else {
                const textAns = line.replace(/^(kunci|jawaban|ans|key)\s*:\s*/i, '').trim();
                if (textAns) answer = textAns;
              }
            } else {
              questionParts.push(line);
            }
          });

          const fullQuestionText = questionParts.join('\n');
          if (!fullQuestionText) return;

          const isPG = Boolean(optA || optB || optC || optD);

          const qObj = {
            id: `q_batch_${baseTime}_${idx}`,
            materialId: selectedMaterial.id,
            mapel: appSession.mapel,
            type: isPG ? 'pg' : 'isian',
            questionText: fullQuestionText,
            optionA: optA || 'Pilihan A',
            optionB: optB || 'Pilihan B',
            optionC: optC || 'Pilihan C',
            optionD: optD || 'Pilihan D',
            correctAnswer: isPG ? answer : (answer || ''),
            createdAt: baseTime + idx
          };

          newParsedQuestions.push(qObj);
        });

        if (newParsedQuestions.length === 0) {
          showNotification("Format teks copy-paste tidak terdeteksi!");
          return;
        }

        setQuestions(prev => [...prev, ...newParsedQuestions]);

        try {
          for (const q of newParsedQuestions) {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'questions', q.id);
            await setDoc(docRef, q);
          }
          showNotification(`Berhasil mengimpor ${newParsedQuestions.length} soal!`);
        } catch (err) {}

        setBatchQuestionsText('');
      };

      const handleDeleteQuestion = async (qId) => {
        if (!window.confirm("Apakah Anda yakin ingin menghapus soal ini?")) return;
        setQuestions(prev => prev.filter(q => q.id !== qId));
        if (editingQuestion && editingQuestion.id === qId) {
          setEditingQuestion(null);
        }
        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'questions', qId);
          await deleteDoc(docRef);
        } catch (e) {}
        showNotification("Soal berhasil dihapus.");
      };

      const handleDeleteScore = async (scoreId) => {
        if (!window.confirm("Apakah Anda yakin ingin menghapus data nilai ini?")) return;
        setScores(prev => prev.filter(s => s.id !== scoreId));
        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'scores', scoreId);
          await deleteDoc(docRef);
        } catch (e) {}
        showNotification("Data nilai berhasil dihapus.");
      };

      const handleDeleteClassScores = async () => {
        if (rekapFilterClass === 'semua') {
          showNotification("Pilih kelas tertentu terlebih dahulu untuk menghapus nilai kelas!");
          return;
        }
        const confirmText = rekapFilterSubClass === 'semua'
          ? `Apakah Anda yakin ingin menghapus SELURUH data nilai Kelas ${rekapFilterClass}?`
          : `Apakah Anda yakin ingin menghapus SELURUH data nilai Kelas ${rekapFilterClass}-${rekapFilterSubClass}?`;

        if (!window.confirm(confirmText)) return;

        const targetScores = scores.filter(s => {
          const matchMapel = s.mapel === appSession.mapel;
          const matchClass = s.kelas === rekapFilterClass;
          const matchSubClass = rekapFilterSubClass === 'semua' || s.subKelas === rekapFilterSubClass;
          return matchMapel && matchClass && matchSubClass;
        });

        if (targetScores.length === 0) {
          showNotification("Tidak ada data nilai yang sesuai dengan filter kelas untuk dihapus.");
          return;
        }

        const idsToDelete = targetScores.map(s => s.id);
        setScores(prev => prev.filter(s => !idsToDelete.includes(s.id)));

        try {
          for (const id of idsToDelete) {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'scores', id);
            await deleteDoc(docRef);
          }
        } catch (e) {}

        showNotification("Data nilai kelas berhasil dihapus.");
      };

      const handleUploadStudents = async (e) => {
        e.preventDefault();
        if (!rawStudentNames.trim()) return;

        const lines = rawStudentNames.split('\n').map(l => l.trim()).filter(l => l !== '');
        const newStus = lines.map((name, i) => ({
          id: `st_${Date.now()}_${i}`,
          name,
          kelas: studentInputKelas,
          subKelas: studentInputSubKelas
        }));

        setStudents(prev => [...prev, ...newStus]);
        setRawStudentNames('');

        try {
          for (const student of newStus) {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'students', student.id);
            await setDoc(docRef, student);
          }
          showNotification(`Berhasil menyimpan ${newStus.length} siswa ke Cloud Database!`);
        } catch (err) {}
      };

      const handleDeleteStudent = async (stId) => {
        setStudents(prev => prev.filter(s => s.id !== stId));
        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'students', stId);
          await deleteDoc(docRef);
        } catch (err) {}
      };

      const handleUpdateStatusMonitoring = async (presenceId, newStatus) => {
        const targetPres = liveMonitorData[presenceId];
        if (!targetPres) return;

        const updatedPres = {
          ...targetPres,
          status: newStatus,
          remainingSeconds: newStatus === 'Selesai' ? 0 : targetPres.remainingSeconds,
          lastUpdated: Date.now()
        };

        setLiveMonitorData(prev => ({
          ...prev,
          [presenceId]: updatedPres
        }));

        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_presence', presenceId);
          await setDoc(docRef, updatedPres);
          showNotification(`Status ${targetPres.studentName} diperbarui ke: ${newStatus}`);
        } catch (e) {}
      };

      const handleDeleteMonitoring = async (presenceId) => {
        if (!window.confirm("Hapus catatan pemantauan siswa ini?")) return;

        setLiveMonitorData(prev => {
          const nextData = { ...prev };
          delete nextData[presenceId];
          return nextData;
        });

        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_presence', presenceId);
          await deleteDoc(docRef);
          showNotification("Catatan pemantauan berhasil dihapus.");
        } catch (e) {}
      };

      const handleDeleteClassMonitoring = async () => {
        if (filterClassGuru === 'semua') {
          showNotification("Pilih kelas tertentu terlebih dahulu untuk menghapus pemantauan kelas!");
          return;
        }

        if (!window.confirm(`Apakah Anda yakin ingin menghapus SELURUH data pemantauan Kelas ${filterClassGuru}?`)) return;

        const targetPresences = Object.values(liveMonitorData).filter(p => {
          const matchMapel = p.mapel === appSession.mapel;
          const matchClass = p.kelas === filterClassGuru;
          return matchMapel && matchClass;
        });

        if (targetPresences.length === 0) {
          showNotification("Tidak ada data pemantauan yang sesuai dengan filter kelas untuk dihapus.");
          return;
        }

        const idsToDelete = targetPresences.map(p => p.id);
        setLiveMonitorData(prev => {
          const nextData = { ...prev };
          idsToDelete.forEach(id => delete nextData[id]);
          return nextData;
        });

        try {
          for (const id of idsToDelete) {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_presence', id);
            await deleteDoc(docRef);
          }
        } catch (e) {}

        showNotification("Data pemantauan kelas berhasil dihapus.");
      };

      const exportToExcel = (filteredScores) => {
        if (!filteredScores || filteredScores.length === 0) {
          showNotification("Tidak ada data nilai yang bisa di-download.");
          return;
        }

        const excelData = filteredScores.map((s, index) => ({
          'No': index + 1,
          'Nama Siswa': s.studentName || '-',
          'Kelas': s.kelas ? `Kelas ${s.kelas}` : '-',
          'Mata Pelajaran': s.mapel || '-',
          'Judul Materi': s.materialTitle || '-',
          'Nilai Akhir': s.score ?? 0,
          'Keterangan': (s.score ?? 0) >= 70 ? 'Lulus' : 'Remidial'
        }));

        const worksheet = XLSX.utils.json_to_sheet(excelData);
        worksheet['!cols'] = [{ wch: 6 }, { wch: 28 }, { wch: 12 }, { wch: 18 }, { wch: 35 }, { wch: 12 }, { wch: 12 }];

        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, 'Rekap Nilai');

        XLSX.writeFile(workbook, `Rekap_Nilai_${appSession.mapel}_Kelas_${rekapFilterClass}_${Date.now()}.xlsx`);
        showNotification("Mendownload File Excel Rekap Nilai...");
      };

      if (!appSession) {
        return (
          <div className="min-h-screen bg-slate-950 flex flex-col justify-center items-center p-4 relative overflow-hidden">
            <div className="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative z-10">
              <div className="text-center mb-6">
                <div className="inline-flex p-3 bg-blue-600 rounded-2xl shadow-lg mb-2">
                  <Lock className="w-8 h-8 text-white" />
                </div>
                <h1 className="text-2xl font-extrabold text-white">Registrasi / Entry Data Guru</h1>
                <p className="text-slate-400 text-xs mt-1">Masukkan data diri awal sebelum mengelola portal kelas</p>
              </div>

              {notification && (
                <div className="bg-red-500/20 border border-red-500/30 text-red-300 px-4 py-2.5 rounded-xl text-xs text-center mb-4">
                  {notification}
                </div>
              )}

              <form onSubmit={handleGuruLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1">Nama Lengkap & Gelar</label>
                  <input 
                    type="text"
                    required
                    placeholder="Contoh: Dra. Hj. Siti Rahmah, M.Pd."
                    value={loginNamaGelar}
                    onChange={(e) => setLoginNamaGelar(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200 text-xs focus:border-blue-500 outline-none"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1">NIP Guru</label>
                  <input 
                    type="text"
                    required
                    placeholder="Masukkan NIP Resmi Anda"
                    value={loginNip}
                    onChange={(e) => setLoginNip(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200 text-xs focus:border-blue-500 outline-none"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1">Mata Pelajaran Diampu</label>
                  <select 
                    value={loginSelectedMapel} 
                    onChange={(e) => setLoginSelectedMapel(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200 text-xs focus:border-blue-500 outline-none font-bold text-blue-400"
                  >
                    {MAPEL_LIST.map(mp => (
                      <option key={mp} value={mp}>{mp}</option>
                    ))}
                  </select>
                </div>

                <button type="submit" className="w-full mt-2 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg flex justify-center items-center gap-2 text-xs">
                  <LogIn className="w-4 h-4"/> Masuk Dashboard Saya ({loginSelectedMapel})
                </button>
              </form>
            </div>
          </div>
        );
      }

      const myTeacherMaterials = materials.filter(m => m.mapel === appSession.mapel);

      const renderTeacherContent = () => {
        if (activeTab === 'monitor') {
          const presenceList = Object.values(liveMonitorData)
            .filter(p => {
              const matchMapel = p.mapel === appSession.mapel;
              const matchClass = filterClassGuru === 'semua' || p.kelas === filterClassGuru;
              return matchMapel && matchClass;
            })
            .sort((a, b) => b.lastUpdated - a.lastUpdated);

          return (
            <div className="space-y-6 max-w-6xl mx-auto">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-xl flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <h2 className="text-lg font-extrabold text-white flex items-center gap-2">
                    <Radio className="w-5 h-5 text-emerald-400 animate-pulse" /> Pantauan Realtime Membaca Siswa - {appSession.mapel}
                  </h2>
                  <p className="text-slate-400 text-xs mt-1">Pemantauan langsung aktivitas membaca & pengerjaan siswa.</p>
                </div>
                <div className="flex flex-wrap items-center gap-2">
                  <button 
                    onClick={handleDeleteClassMonitoring} 
                    disabled={filterClassGuru === 'semua'} 
                    className="text-red-400 hover:text-white disabled:opacity-50 flex items-center gap-1.5 text-xs font-semibold bg-red-500/10 hover:bg-red-600 border border-red-500/20 px-3 py-2 rounded-xl transition-all"
                  >
                    <Trash2 className="w-4 h-4"/> Hapus Pemantauan Kelas {filterClassGuru !== 'semua' ? filterClassGuru : ''}
                  </button>
                  <button onClick={() => setActiveTab('dashboard')} className="text-slate-400 hover:text-white flex items-center gap-1 text-xs font-semibold bg-slate-950 border border-slate-800 px-3 py-2 rounded-xl">
                    <ArrowLeft className="w-4 h-4"/> Kembali
                  </button>
                </div>
              </div>

              <div className="flex items-center gap-2 bg-slate-900 border border-slate-800 p-3 rounded-2xl text-xs font-semibold">
                <span className="text-slate-400">Filter Pemantauan Kelas:</span>
                {['semua', '7', '8', '9'].map(k => (
                  <button 
                    key={k} 
                    onClick={() => setFilterClassGuru(k)} 
                    className={`px-3 py-1.5 rounded-lg capitalize transition-all ${filterClassGuru === k ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}`}
                  >
                    {k === 'semua' ? 'Semua' : `Kelas ${k}`}
                  </button>
                ))}
              </div>

              {presenceList.length === 0 ? (
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-12 text-center text-slate-500 italic text-xs">
                  Belum ada aktivitas membaca/belajar yang terpantau pada mapel {appSession.mapel} {filterClassGuru !== 'semua' ? `Kelas ${filterClassGuru}` : ''}.
                </div>
              ) : (
                <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead>
                        <tr className="bg-slate-950 text-slate-400 border-b border-slate-800">
                          <th className="p-4">Nama Siswa</th>
                          <th className="p-4">Kelas</th>
                          <th className="p-4">Materi Dibuka</th>
                          <th className="p-4">Sisa Timer</th>
                          <th className="p-4">Status Pemantauan</th>
                          <th className="p-4 text-center">Aksi Guru</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800 text-slate-300">
                        {presenceList.map(p => {
                          let badgeStyle = "bg-emerald-500/20 text-emerald-400 border-emerald-500/30";
                          if (p.status === 'Membuka Tab Lain') {
                            badgeStyle = "bg-amber-500/20 text-amber-400 border-amber-500/30";
                          } else if (p.status === 'Selesai') {
                            badgeStyle = "bg-red-500/20 text-red-400 border-red-500/30";
                          }

                          return (
                            <tr key={p.id} className="hover:bg-slate-800/40 transition-colors">
                              <td className="p-4 font-bold text-white">{p.studentName}</td>
                              <td className="p-4">Kelas {p.kelas}-{p.subKelas}</td>
                              <td className="p-4">{p.materialTitle}</td>
                              <td className="p-4 font-mono text-amber-300 font-bold">
                                {Math.floor((p.remainingSeconds || 0) / 60)}:{((p.remainingSeconds || 0) % 60).toString().padStart(2, '0')}
                              </td>
                              <td className="p-4">
                                <span className={`px-2.5 py-1 rounded-full text-[11px] font-bold border inline-block ${badgeStyle}`}>
                                  {p.status || 'Sedang Belajar'}
                                </span>
                              </td>
                              <td className="p-4 text-center">
                                <div className="flex items-center justify-center gap-1.5">
                                  <button 
                                    onClick={() => handleUpdateStatusMonitoring(p.id, 'Sedang Belajar')}
                                    title="Aktifkan / Set Sedang Belajar"
                                    className="p-1.5 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/30 rounded-lg transition-all"
                                  >
                                    <Play className="w-3.5 h-3.5" />
                                  </button>
                                  <button 
                                    onClick={() => handleUpdateStatusMonitoring(p.id, 'Selesai')}
                                    title="Hentikan / Set Selesai"
                                    className="p-1.5 bg-amber-600/20 hover:bg-amber-600/30 text-amber-400 border border-amber-500/30 rounded-lg transition-all"
                                  >
                                    <StopCircle className="w-3.5 h-3.5" />
                                  </button>
                                  <button 
                                    onClick={() => handleDeleteMonitoring(p.id)}
                                    title="Hapus Pemantauan"
                                    className="p-1.5 bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/30 rounded-lg transition-all"
                                  >
                                    <Trash2 className="w-3.5 h-3.5" />
                                  </button>
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </div>
          );
        }

        if (activeTab === 'tambah_materi' || activeTab === 'edit_materi') {
          const isEdit = activeTab === 'edit_materi' && editingMaterial;
          return (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 max-w-4xl mx-auto shadow-xl">
              <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
                <h2 className="text-lg font-bold text-white flex items-center gap-2">
                  {isEdit ? <Edit className="text-amber-500"/> : <PlusCircle className="text-blue-500"/>}
                  {isEdit ? 'Edit Materi' : `Terbitkan Materi (${appSession.mapel})`}
                </h2>
                <button onClick={() => { setActiveTab('dashboard'); setEditingMaterial(null); }} className="text-slate-400 hover:text-white flex items-center gap-1 text-xs font-semibold">
                  <ArrowLeft className="w-4 h-4"/> Kembali
                </button>
              </div>

              <form onSubmit={isEdit ? handleUpdateMaterial : handleCreateMaterial} className="space-y-4">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="md:col-span-2">
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Judul Materi Pembelajaran</label>
                    <input type="text" name="title" defaultValue={isEdit ? editingMaterial.title : ''} required className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-blue-500" placeholder="Contoh: Hukum Newton & Penerapannya" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Durasi Timer (Menit)</label>
                    <input type="number" min="1" max="180" name="durationMinutes" defaultValue={isEdit ? editingMaterial.durationMinutes : '15'} required className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-blue-500" />
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Tingkat Kelas</label>
                    <select name="kelas" defaultValue={isEdit ? editingMaterial.kelas : '7'} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white">
                      <option value="7">Kelas 7</option>
                      <option value="8">Kelas 8</option>
                      <option value="9">Kelas 9</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Target Rombel</label>
                    <select name="subKelasTarget" defaultValue={isEdit ? editingMaterial.subKelasTarget : 'semua'} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white">
                      <option value="semua">Semua Rombel (A, B, C, D)</option>
                      <option value="A">Rombel A</option>
                      <option value="B">Rombel B</option>
                      <option value="C">Rombel C</option>
                      <option value="D">Rombel D</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Semester</label>
                    <select name="semester" defaultValue={isEdit ? editingMaterial.semester : '1'} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white">
                      <option value="1">Semester 1 (Ganjil)</option>
                      <option value="2">Semester 2 (Genap)</option>
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">URL Gambar / Diagram (Opsional)</label>
                    <input type="url" name="imageUrl" defaultValue={isEdit ? editingMaterial.imageUrl : ''} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:border-blue-500 outline-none" placeholder="https://..." />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-purple-400 mb-1 font-bold">Link Game Interaktif (Wordwall/Quizizz/dll)</label>
                    <input type="url" name="gameUrl" defaultValue={isEdit ? editingMaterial.gameUrl : ''} className="w-full bg-slate-950 border border-purple-500/50 rounded-xl p-3 text-xs text-white focus:border-purple-500 outline-none" placeholder="https://wordwall.net/..." />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Sumber Referensi Materi</label>
                    <input type="text" name="source" defaultValue={isEdit ? editingMaterial.source : ''} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:border-blue-500 outline-none" placeholder="Buku Paket Kemendikbud Hal. 45" />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1">Isi Materi Pembelajaran (Mendukung Simbol Rumus $x^2$ & Tabel)</label>
                  <textarea name="content" defaultValue={isEdit ? editingMaterial.content : ''} required rows="10" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:border-blue-500 outline-none leading-relaxed font-mono" placeholder="Tulis uraian materi di sini... Format nomor/baris akan mengikuti sesuai copy paste."></textarea>
                </div>

                <button type="submit" className="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-xl transition-all shadow-lg text-xs">
                  {isEdit ? 'Simpan Perubahan Materi' : 'Terbitkan Materi'}
                </button>
              </form>
            </div>
          );
        }

        if (activeTab === 'kelola_soal' && selectedMaterial) {
          const matQuestions = questions.filter(q => q.materialId === selectedMaterial.id);
          
          return (
            <div className="space-y-6 max-w-5xl mx-auto">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-xl">
                <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
                  <div>
                    <h2 className="text-lg font-bold text-white flex items-center gap-2"><List className="text-blue-500"/> Kelola Soal Materi: {selectedMaterial.title}</h2>
                    <p className="text-xs text-slate-400">Mapel: <span className="text-blue-400 font-bold">{appSession.mapel}</span></p>
                  </div>
                  <button onClick={() => {setActiveTab('dashboard'); setSelectedMaterial(null); setEditingQuestion(null); setFormQuestionType('pg');}} className="text-slate-400 hover:text-white flex items-center gap-1 text-xs font-semibold">
                    <ArrowLeft className="w-4 h-4"/> Kembali
                  </button>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  {/* MODUL 1: INPUT / EDIT SATU SOAL */}
                  <form key={editingQuestion ? editingQuestion.id : 'new_question'} onSubmit={handleSaveQuestion} className={`space-y-3 bg-slate-950 p-4 rounded-xl border ${editingQuestion ? 'border-amber-500/50 bg-amber-500/5' : 'border-slate-800'}`}>
                    <div className="flex items-center justify-between">
                      <h3 className="font-bold text-white text-xs flex items-center gap-1.5">
                        {editingQuestion ? (
                          <>
                            <Edit className="w-4 h-4 text-amber-400"/> Edit Soal
                          </>
                        ) : (
                          <>
                            <PlusCircle className="w-4 h-4 text-emerald-400"/> Input Soal Tunggal
                          </>
                        )}
                      </h3>
                      {editingQuestion && (
                        <button 
                          type="button" 
                          onClick={() => { setEditingQuestion(null); setFormQuestionType('pg'); }}
                          className="text-[11px] text-amber-400 hover:text-white flex items-center gap-1 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20"
                        >
                          <X className="w-3 h-3"/> Batal Edit
                        </button>
                      )}
                    </div>
                    
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">Pertanyaan (Mendukung Simbol $a^2+b^2=c^2$ & HTML Tabel)</label>
